<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کاربری GPS Tracker</title>
    <link rel="icon" href="/ico.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0c0e1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== هدر ===== */
        .panel-header {
            max-width: 1100px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 12px;
        }

        .panel-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }

        .panel-header .brand .logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .panel-header .brand .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .panel-header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .panel-header .user-info .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
        }

        .panel-header .user-info .name {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .panel-header .user-info .name small {
            display: block;
            font-weight: 400;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .panel-header .user-info .logout-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .panel-header .user-info .logout-btn:hover {
            background: rgba(255, 107, 107, 0.15);
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        /* ===== دکمه فروشگاه ===== */
        .shop-btn-wrapper {
            max-width: 1100px;
            margin: 0 auto 30px;
        }

        .shop-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px 24px;
            border-radius: 16px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            width: 100%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 4px 20px rgba(245, 87, 108, 0.3);
        }

        .shop-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.4);
        }

        .shop-btn i {
            font-size: 22px;
        }

        .shop-btn .btn-sub {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.7;
        }

        /* ===== لیست دستگاه‌ها ===== */
        .devices-section {
            max-width: 1100px;
            margin: 0 auto;
        }

        .devices-section .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .devices-section .section-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .devices-section .section-header .badge {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .device-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .device-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .device-card .device-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }

        .device-card .device-id {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .device-card .device-info {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.8;
        }

        .device-card .device-info span {
            display: block;
        }

        .device-card .device-status {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .device-card .device-status.online {
            background: rgba(81, 207, 102, 0.15);
            color: #51cf66;
        }

        .device-card .device-status.offline {
            background: rgba(255, 107, 107, 0.15);
            color: #ff6b6b;
        }

        .device-card .device-status.inactive {
            background: rgba(255, 193, 7, 0.15);
            color: #fcc419;
        }

        .device-card .device-arrow {
            position: absolute;
            left: 20px;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.1);
            font-size: 20px;
            transition: all 0.3s;
        }

        .device-card:hover .device-arrow {
            color: #00d4ff;
            transform: translateX(-5px);
        }

        .device-card .device-lock {
            position: absolute;
            top: 16px;
            left: 16px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
        }

        .empty-devices {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.2);
            grid-column: 1 / -1;
        }

        .empty-devices i {
            font-size: 60px;
            margin-bottom: 16px;
            display: block;
        }

        .empty-devices p {
            font-size: 16px;
        }

        .empty-devices .highlight {
            color: #f5576c;
        }

        /* ===== مودال رمز عبور ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: #1a1f3a;
            border-radius: 24px;
            padding: 40px 35px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-content .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-content .modal-header .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .modal-content .modal-header h2 {
            color: #fff;
            font-size: 20px;
        }

        .modal-content .modal-header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        .modal-content .form-group {
            margin-bottom: 16px;
        }

        .modal-content .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .modal-content .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .modal-content .form-group input:focus {
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-content .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .modal-content .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-content .modal-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-content .modal-actions .btn-confirm {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
            box-shadow: 0 4px 20px rgba(79, 172, 254, 0.3);
        }

        .modal-content .modal-actions .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(79, 172, 254, 0.4);
        }

        .modal-content .modal-actions .btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .modal-content .modal-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
        }

        .modal-content .modal-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-content .modal-msg {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            display: none;
        }

        .modal-content .modal-msg.show {
            display: block;
        }

        .modal-content .modal-msg.error {
            color: #ff6b6b;
        }

        /* ===== لودینگ ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(12, 14, 26, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 700px) {
            .panel-header {
                flex-direction: column;
                text-align: center;
            }

            .panel-header .user-info {
                flex-wrap: wrap;
                justify-content: center;
            }

            .devices-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 24px 18px;
            }

            .modal-content .modal-actions {
                flex-direction: column;
            }
        }

        @media (max-width: 400px) {
            .panel-header .brand {
                font-size: 16px;
            }

            .panel-header .brand .logo {
                width: 35px;
                height: 35px;
            }

            .shop-btn {
                font-size: 15px;
                padding: 16px;
            }

            .device-card {
                padding: 18px;
            }
        }
    </style>
</head>
<script src="/loading.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!window.location.href.includes('loading.html')) {
            autoLoading();
        }
    });
</script>
<body>

    <!-- لودینگ -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- هدر -->
    <header class="panel-header">
        <div class="brand">
            <div class="logo">
                <img src="/ico.png" alt="GPS Tracker">
            </div>
            <span>GPS Tracker</span>
        </div>

        <div class="user-info">
            <div class="avatar" id="userAvatar">U</div>
            <div class="name" id="userNameDisplay">
                کاربر
                <small id="userRoleDisplay">وارد شده</small>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> خروج
            </button>
        </div>
    </header>

    <!-- دکمه فروشگاه -->
    <div class="shop-btn-wrapper">
        <a href="/shop.html" class="shop-btn">
            <i class="fas fa-store"></i>
            فروشگاه
            <span class="btn-sub">خرید دستگاه GPS</span>
        </a>
    </div>

    <!-- لیست دستگاه‌ها -->
    <section class="devices-section">
        <div class="section-header">
            <h2>📱 دستگاه‌های من</h2>
            <span class="badge" id="deviceCount">۰ دستگاه</span>
        </div>

        <div class="devices-grid" id="devicesGrid">
            <!-- توسط JS ساخته می‌شود -->
        </div>
    </section>

    <!-- مودال رمز عبور -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="icon">🔐</span>
                <h2 id="modalDeviceName">ورود به دستگاه</h2>
                <p id="modalDeviceId">رمز عبور دستگاه را وارد کنید</p>
            </div>

            <form id="passwordForm">
                <input type="hidden" id="targetDeviceId">

                <div class="form-group">
                    <label>رمز عبور دستگاه</label>
                    <input type="password" id="devicePassword" placeholder="رمز عبور دستگاه را وارد کنید" required>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn-confirm" id="confirmBtn">
                        <i class="fas fa-unlock"></i>
                        ورود به دستگاه
                    </button>
                    <button type="button" class="btn-cancel" id="cancelBtn">انصراف</button>
                </div>

                <div class="modal-msg" id="modalMsg"></div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // متغیرها
        // ============================================================
        let userData = null;
        let devices = [];

        // ============================================================
        // توابع کمکی
        // ============================================================
        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('show', show);
        }

        function getInitials(name) {
            if (!name) return 'U';
            const parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
        }

        function getStatus(device) {
            if (device.is_active === 0) return { text: 'غیرفعال', class: 'inactive' };
            const lastUpdate = device.last_update ? new Date(device.last_update).getTime() : 0;
            const isOnline = Date.now() - lastUpdate < 120000;
            return isOnline ? { text: 'آنلاین', class: 'online' } : { text: 'آفلاین', class: 'offline' };
        }

        function showModalMsg(message, type) {
            const el = document.getElementById('modalMsg');
            el.textContent = message;
            el.className = 'modal-msg show ' + type;
        }

        function hideModalMsg() {
            const el = document.getElementById('modalMsg');
            el.className = 'modal-msg';
        }

        // ============================================================
        // بارگذاری داده‌ها
        // ============================================================
        async function loadUserData() {
            showLoading(true);
            try {
                const res = await fetch('/api/user-session-check');
                const data = await res.json();

                if (!data.isLoggedIn) {
                    window.location.href = '/login.html';
                    return;
                }

                userData = data.user;
                devices = data.devices || [];
                updateUI();

            } catch (err) {
                console.error('خطا:', err);
                window.location.href = '/login.html';
            } finally {
                showLoading(false);
            }
        }

        // ============================================================
        // بروزرسانی UI
        // ============================================================
        function updateUI() {
            // اطلاعات کاربر
            const nameEl = document.getElementById('userNameDisplay');
            const avatarEl = document.getElementById('userAvatar');

            if (userData) {
                const displayName = userData.full_name || userData.username || 'کاربر';
                nameEl.innerHTML = `
                    ${displayName}
                    <small>${userData.role === 'admin' ? '🛡️ ادمین' : '👤 کاربر'}</small>
                `;
                avatarEl.textContent = getInitials(displayName);
            }

            // تعداد دستگاه‌ها
            document.getElementById('deviceCount').textContent = `${devices.length} دستگاه`;

            // رندر دستگاه‌ها
            renderDevices();
        }

        // ============================================================
        // رندر دستگاه‌ها
        // ============================================================
        function renderDevices() {
            const grid = document.getElementById('devicesGrid');

            if (!devices || devices.length === 0) {
                grid.innerHTML = `
                    <div class="empty-devices">
                        <i class="fas fa-microchip"></i>
                        <p>شما هیچ دستگاهی ندارید</p>
                        <p style="font-size:13px; margin-top:8px;">
                            برای خرید دستگاه به <span class="highlight">فروشگاه</span> بروید
                        </p>
                    </div>
                `;
                return;
            }

            let html = '';
            devices.forEach(device => {
                const status = getStatus(device);
                const lastLocation = device.last_latitude && device.last_longitude ?
                    `${device.last_latitude.toFixed(5)}, ${device.last_longitude.toFixed(5)}` :
                    'بدون موقعیت';

                html += `
                    <div class="device-card" onclick="openPasswordModal('${device.device_id}')">
                        <span class="device-lock"><i class="fas fa-lock"></i></span>
                        <span class="device-icon">📡</span>
                        <div class="device-id">${device.device_id}</div>
                        <div class="device-info">
                            <span>👤 ${device.buyer_name || '—'} ${device.buyer_family || ''}</span>
                            <span>🚗 ${device.car_type || '—'} (${device.car_plate || '—'})</span>
                            <span>📏 ${(device.total_distance || 0).toFixed(1)} کیلومتر</span>
                            <span>📍 ${lastLocation}</span>
                        </div>
                        <span class="device-status ${status.class}">● ${status.text}</span>
                        <span class="device-arrow"><i class="fas fa-chevron-left"></i></span>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // ============================================================
        // مودال رمز عبور
        // ============================================================
        function openPasswordModal(deviceId) {
            document.getElementById('modalOverlay').classList.add('show');
            document.getElementById('modalDeviceName').textContent = `ورود به ${deviceId}`;
            document.getElementById('modalDeviceId').textContent = `رمز عبور دستگاه ${deviceId} را وارد کنید`;
            document.getElementById('targetDeviceId').value = deviceId;
            document.getElementById('devicePassword').value = '';
            hideModalMsg();
            document.getElementById('confirmBtn').disabled = false;
            document.getElementById('confirmBtn').innerHTML = '<i class="fas fa-unlock"></i> ورود به دستگاه';

            setTimeout(() => {
                document.getElementById('devicePassword').focus();
            }, 300);
        }

        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('modalOverlay').classList.remove('show');
        });

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('modalOverlay').classList.remove('show');
            }
        });

        // ============================================================
        // ورود با رمز دستگاه
        // ============================================================
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const deviceId = document.getElementById('targetDeviceId').value;
            const password = document.getElementById('devicePassword').value.trim();

            if (!password) {
                showModalMsg('لطفاً رمز عبور دستگاه را وارد کنید', 'error');
                return;
            }

            const btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال بررسی...';
            hideModalMsg();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, password })
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('modalOverlay').classList.remove('show');
                    window.location.href = '/index.html';
                } else {
                    showModalMsg(data.error || 'رمز عبور اشتباه است', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-unlock"></i> ورود به دستگاه';
                    document.getElementById('devicePassword').focus();
                }
            } catch (err) {
                showModalMsg('خطا در اتصال به سرور', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-unlock"></i> ورود به دستگاه';
            }
        });

        // ============================================================
        // خروج
        // ============================================================
        async function logout() {
            showLoading(true);
            try {
                await fetch('/api/user-logout-web', { method: 'POST' });
                await fetch('/api/user-logout', { method: 'POST' });
            } catch (err) {
                console.log('خطا در خروج:', err);
            }
            window.location.href = '/login.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);

        // ============================================================
        // اجرا
        // ============================================================
        document.addEventListener('DOMContentLoaded', loadUserData);
    </script>

</body>
</html>
