<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل کاربر | GPS Tracker</title>
    <link rel="icon" href="/ico.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4facfe;
            --secondary: #7c3aed;
            --bg-dark: #0c0e1a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-color: rgba(255, 255, 255, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text-primary);
            direction: rtl;
            min-height: 100vh;
            padding: 20px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .app-header {
            background: rgba(12, 14, 26, 0.92);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            min-height: 64px;
            margin: -20px -20px 20px -20px;
            padding: 12px 24px;
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .app-header .brand .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255,255,255,0.05);
        }
        .app-header .brand .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .app-header .brand .brand-text h1 {
            font-size: 16px; font-weight: 700; color: white;
        }
        .app-header .brand .brand-text span {
            font-size: 10px; color: var(--text-secondary);
        }
        .app-header .user-menu {
            display: flex; align-items: center; gap: 12px;
        }
        .app-header .user-menu .user-badge {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.04);
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .app-header .user-menu .user-badge .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: white;
        }
        .app-header .user-menu .user-badge .user-info-text .name {
            font-size: 13px; font-weight: 600; color: white;
        }
        .app-header .user-menu .user-badge .user-info-text .device-id-small {
            font-size: 9px; color: var(--text-secondary); direction: ltr;
        }
        .app-header .user-menu .btn-icon {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 38px; height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .app-header .user-menu .btn-icon:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }
        .app-header .user-menu .btn-icon.danger:hover {
            background: rgba(234,67,53,0.2);
            color: #ff6b6b;
        }
        .app-header .user-menu .btn-icon.active {
            background: rgba(79,172,254,0.15);
            color: var(--primary);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            flex-shrink: 0;
            color: #fff;
        }
        .profile-info h2 {
            font-size: 22px;
            margin-bottom: 4px;
            color: #fff;
        }
        .profile-info .username {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .profile-info .role {
            display: inline-block;
            padding: 2px 12px;
            background: rgba(79,172,254,0.2);
            border-radius: 20px;
            font-size: 12px;
            color: var(--primary);
            margin-top: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 14px;
        }
        .info-row .label {
            color: var(--text-secondary);
        }
        .info-row .value {
            color: #4FC3F7;
        }

        .devices-section {
            margin-top: 24px;
        }
        .devices-section h3 {
            font-size: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }
        .device-item {
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .device-item .device-id {
            font-family: monospace;
            color: #4FC3F7;
            font-size: 14px;
        }
        .device-item .device-name {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .device-item .device-status {
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 20px;
        }
        .device-item .device-status.active {
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
        }
        .device-item .device-status.inactive {
            background: rgba(234,67,53,0.2);
            color: #ff6b6b;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .btn-primary:hover { transform: scale(1.02); }
        .btn-danger {
            background: rgba(234,67,53,0.15);
            color: #ff6b6b;
            border: 1px solid rgba(234,67,53,0.2);
        }
        .btn-danger:hover { background: rgba(234,67,53,0.25); }
        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .actions .btn {
            flex: 1;
            justify-content: center;
            min-width: 100px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
            color: rgba(255,255,255,0.05);
        }

        .logout-btn {
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .app-header { margin: -12px -12px 16px -12px; padding: 10px 16px; }
            .app-header .brand .brand-text h1 { font-size: 14px; }
            .app-header .brand .brand-text span { display: none; }
            .app-header .user-menu .user-badge { padding: 4px 10px 4px 4px; }
            .app-header .user-menu .user-badge .user-info-text .device-id-small { display: none; }
            .app-header .user-menu .btn-icon { width: 34px; height: 34px; font-size: 13px; }
            .profile-card { padding: 20px; }
            .profile-header { flex-direction: column; text-align: center; gap: 12px; }
            .profile-avatar { width: 64px; height: 64px; font-size: 26px; }
            .profile-info h2 { font-size: 18px; }
            .actions .btn { flex: none; width: 100%; }
        }
        @media (max-width: 480px) {
            .app-header .brand .logo { width: 32px; height: 32px; }
            .profile-avatar { width: 56px; height: 56px; font-size: 22px; }
            .device-item { flex-direction: column; align-items: flex-start; gap: 6px; }
            .device-item .device-status { align-self: flex-start; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <a href="/index.html" class="brand">
            <div class="logo">
                <img src="/ico.png" alt="GPS Tracker">
            </div>
            <div class="brand-text">
                <h1>GPS Tracker</h1>
                <span>سیستم ردیابی لحظه‌ای</span>
            </div>
        </a>
        <div class="user-menu">
            <div class="user-badge">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-info-text">
                    <span class="name" id="userNameDisplay">کاربر</span>
                    <span class="device-id-small" id="deviceIdSmall">🆔 ---</span>
                </div>
            </div>
            <a href="/index.html" class="btn-icon" title="نقشه"><i class="fas fa-map"></i></a>
            <a href="/trips.html" class="btn-icon" title="سفرها"><i class="fas fa-route"></i></a>
            <a href="/shared-links.html" class="btn-icon" title="لینک‌های اشتراک"><i class="fas fa-link"></i></a>
            <button class="btn-icon danger" onclick="logoutUser()" title="خروج"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar" id="userAvatarBig">U</div>
                <div class="profile-info">
                    <h2 id="userFullName">کاربر</h2>
                    <div class="username" id="userUsername">@username</div>
                    <span class="role" id="userRole">کاربر</span>
                </div>
            </div>

            <div id="profileInfo">
                <div class="info-row">
                    <span class="label">📱 تلفن</span>
                    <span class="value" id="userPhone">---</span>
                </div>
                <div class="info-row">
                    <span class="label">✉️ ایمیل</span>
                    <span class="value" id="userEmail">---</span>
                </div>
                <div class="info-row">
                    <span class="label">🆔 شناسه کاربری</span>
                    <span class="value" id="userId">---</span>
                </div>
            </div>

            <div class="devices-section">
                <h3><i class="fas fa-satellite"></i> دستگاه‌های من</h3>
                <div id="devicesList">
                    <div class="empty-state">
                        <i class="fas fa-satellite"></i>
                        <p>هیچ دستگاهی به شما اختصاص داده نشده</p>
                        <p style="font-size:12px;margin-top:8px;">برای دریافت دستگاه با ادمین تماس بگیرید</p>
                    </div>
                </div>
            </div>

            <div class="actions">
                <a href="/index.html" class="btn btn-primary">
                    <i class="fas fa-map"></i> نقشه
                </a>
                <a href="/trips.html" class="btn btn-outline">
                    <i class="fas fa-route"></i> سفرها
                </a>
                <button class="btn btn-danger logout-btn" onclick="logoutUser()">
                    <i class="fas fa-sign-out-alt"></i> خروج از سیستم
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    سیستم لودینگ
    ============================================================ -->
    <script src="/loading.js"></script>
    <script>
        // فعال‌سازی لودینگ
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.location.href.includes('loading.html')) {
                autoLoading();
            }
        });

        // ============================================================
        // CHECK SESSION
        // ============================================================
        async function checkSession() {
            try {
                const response = await fetch('/api/user-session-check');
                const result = await response.json();

                if (!result.isLoggedIn) {
                    window.location.href = '/login.html';
                    return;
                }

                renderProfile(result.user, result.devices);
            } catch (e) {
                window.location.href = '/login.html';
            }
        }

        function renderProfile(user, devices) {
            const displayName = user.full_name || user.username;
            document.getElementById('userFullName').textContent = displayName;
            document.getElementById('userUsername').textContent = '@' + user.username;
            document.getElementById('userAvatarBig').textContent = displayName.charAt(0).toUpperCase();
            document.getElementById('userNameDisplay').textContent = displayName;
            document.getElementById('userAvatar').textContent = displayName.charAt(0).toUpperCase();
            document.getElementById('userRole').textContent = user.role === 'admin' ? '🛡️ ادمین' : '👤 کاربر';
            document.getElementById('userPhone').textContent = user.phone || '---';
            document.getElementById('userEmail').textContent = user.email || '---';
            document.getElementById('userId').textContent = '#' + user.id;
            document.getElementById('deviceIdSmall').textContent = '🆔 ' + (devices && devices.length > 0 ? devices[0].device_id : '---');

            const devicesList = document.getElementById('devicesList');
            
            if (!devices || devices.length === 0) {
                devicesList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-satellite"></i>
                        <p>هیچ دستگاهی به شما اختصاص داده نشده</p>
                        <p style="font-size:12px;margin-top:8px;">برای دریافت دستگاه با ادمین تماس بگیرید</p>
                    </div>
                `;
                return;
            }

            devicesList.innerHTML = devices.map(d => `
                <div class="device-item">
                    <div>
                        <div class="device-id">🆔 ${d.device_id}</div>
                        <div class="device-name">
                            ${d.buyer_name || ''} ${d.buyer_family || ''} • ${d.car_type || 'نامشخص'}
                            ${d.car_plate ? ' • ' + d.car_plate : ''}
                        </div>
                    </div>
                    <span class="device-status ${d.is_active ? 'active' : 'inactive'}">
                        ${d.is_active ? '✅ فعال' : '❌ غیرفعال'}
                    </span>
                </div>
            `).join('');
        }

        async function logoutUser() {
            if (!confirm('آیا از خروج از سیستم مطمئن هستید؟')) return;
            try {
                await fetch('/api/user-logout-web', { method: 'POST' });
                window.location.href = '/login.html';
            } catch (e) {
                window.location.href = '/login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', checkSession);
    </script>

</body>
</html>
