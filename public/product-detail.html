<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات محصول | GPS Tracker</title>
    <link rel="icon" href="/ico.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4facfe;
            --secondary: #7c3aed;
            --bg-dark: #0c0e1a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-color: rgba(255, 255, 255, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --font: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            direction: rtl;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .app-header {
            background: rgba(12, 14, 26, 0.92);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            min-height: 64px;
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .app-header .brand .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255,255,255,0.05);
        }
        .app-header .brand .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .app-header .brand .brand-text h1 {
            font-size: 16px; font-weight: 700; color: white;
        }
        .app-header .brand .brand-text span {
            font-size: 10px; color: var(--text-secondary);
        }
        .app-header .user-menu {
            display: flex; align-items: center; gap: 12px;
        }
        .app-header .user-menu .user-badge {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.04);
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .app-header .user-menu .user-badge .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: white;
        }
        .app-header .user-menu .user-badge .user-info-text .name {
            font-size: 13px; font-weight: 600; color: white;
        }
        .app-header .user-menu .user-badge .user-info-text .device-id-small {
            font-size: 9px; color: var(--text-secondary); direction: ltr;
        }
        .app-header .user-menu .btn-icon {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 38px; height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .app-header .user-menu .btn-icon:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }
        .app-header .user-menu .btn-icon.danger:hover {
            background: rgba(234,67,53,0.2);
            color: #ff6b6b;
        }
        .app-header .user-menu .btn-icon.active {
            background: rgba(79,172,254,0.15);
            color: var(--primary);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 30px;
            border: 1px solid var(--border-color);
        }
        .product-detail .images-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-detail .images-section .main-image {
            width: 100%;
            height: 400px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: rgba(255,255,255,0.03);
        }
        .product-detail .images-section .main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-detail .images-section .thumbnails {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .product-detail .images-section .thumbnails .thumb {
            width: 70px;
            height: 70px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }
        .product-detail .images-section .thumbnails .thumb.active {
            border-color: var(--primary);
        }
        .product-detail .images-section .thumbnails .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-detail .images-section .video-container {
            margin-top: 10px;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .product-detail .images-section .video-container video {
            width: 100%;
            max-height: 300px;
            border-radius: var(--radius-sm);
        }

        .product-detail .info-section .product-name {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
        }
        .product-detail .info-section .product-category {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .product-detail .info-section .product-price {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
        }
        .product-detail .info-section .product-price .current {
            font-size: 28px;
            font-weight: 800;
            color: #4FC3F7;
        }
        .product-detail .info-section .product-price .old {
            font-size: 18px;
            color: var(--text-muted);
            text-decoration: line-through;
        }
        .product-detail .info-section .product-price .discount-badge {
            background: rgba(234,67,53,0.15);
            color: #ff6b6b;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .product-detail .info-section .product-stock {
            margin-top: 10px;
            font-size: 14px;
        }
        .product-detail .info-section .product-stock.in-stock {
            color: #4CAF50;
        }
        .product-detail .info-section .product-stock.out-of-stock {
            color: #ff6b6b;
        }
        .product-detail .info-section .product-description {
            margin-top: 16px;
            color: var(--text-secondary);
            line-height: 1.8;
            font-size: 15px;
        }
        .product-detail .info-section .product-features {
            margin-top: 16px;
        }
        .product-detail .info-section .product-features h4 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 8px;
        }
        .product-detail .info-section .product-features ul {
            list-style: none;
            padding: 0;
        }
        .product-detail .info-section .product-features ul li {
            padding: 6px 0;
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .product-detail .info-section .product-features ul li i {
            color: var(--primary);
        }

        .product-detail .info-section .product-specs {
            margin-top: 20px;
        }
        .product-detail .info-section .product-specs h4 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 10px;
        }
        .product-detail .info-section .product-specs table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .product-detail .info-section .product-specs table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .product-detail .info-section .product-specs table td:first-child {
            color: var(--text-secondary);
            font-weight: 600;
            width: 40%;
        }
        .product-detail .info-section .product-specs table td:last-child {
            color: #fff;
        }

        .product-detail .info-section .buy-section {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .product-detail .info-section .buy-section .btn {
            padding: 14px 40px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .product-detail .info-section .buy-section .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .product-detail .info-section .buy-section .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(79,172,254,0.3);
        }
        .product-detail .info-section .buy-section .btn-outline {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-secondary);
        }
        .product-detail .info-section .buy-section .btn-outline:hover {
            border-color: var(--primary);
            color: white;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .loading-spinner i {
            font-size: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-box {
            text-align: center;
            padding: 60px 20px;
            color: #ff6b6b;
        }
        .error-box i {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }
        .error-box h2 {
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            .product-detail .images-section .main-image {
                height: 250px;
            }
            .product-detail .info-section .product-name {
                font-size: 22px;
            }
            .product-detail .info-section .product-price .current {
                font-size: 22px;
            }
            .app-header { padding: 10px 14px; }
            .app-header .brand .brand-text h1 { font-size: 14px; }
            .app-header .brand .brand-text span { display: none; }
            .app-header .user-menu .user-badge { padding: 4px 10px 4px 4px; }
            .app-header .user-menu .user-badge .user-info-text .device-id-small { display: none; }
            .app-header .user-menu .btn-icon { width: 34px; height: 34px; font-size: 13px; }
        }
        @media (max-width: 480px) {
            .product-detail .images-section .main-image { height: 200px; }
            .product-detail .images-section .thumbnails .thumb { width: 50px; height: 50px; }
            .product-detail .info-section .buy-section .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <a href="/" class="brand">
            <div class="logo">
                <img src="/ico.png" alt="GPS Tracker">
            </div>
            <div class="brand-text">
                <h1>GPS Tracker</h1>
                <span>جزئیات محصول</span>
            </div>
        </a>
        <div class="user-menu">
            <div class="user-badge" id="userBadge" style="display:none;">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-info-text">
                    <span class="name" id="userNameDisplay">کاربر</span>
                    <span class="device-id-small" id="deviceIdSmall">🆔 ---</span>
                </div>
            </div>
            <a href="/shop.html" class="btn-icon" title="فروشگاه"><i class="fas fa-store"></i></a>
            <a href="/index.html" class="btn-icon" title="نقشه"><i class="fas fa-map"></i></a>
            <button class="btn-icon danger" onclick="logoutUser()" title="خروج"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <!-- CONTENT -->
    <div class="container">
        <a href="/shop.html" class="back-btn">
            <i class="fas fa-arrow-right"></i> بازگشت به فروشگاه
        </a>

        <div id="productContent">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch fa-spin"></i>
                <p style="margin-top:16px;">در حال بارگذاری...</p>
            </div>
        </div>
    </div>

    <script src="/loading.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.location.href.includes('loading.html')) {
                autoLoading();
            }
        });

        // ============================================================
        // USER SESSION
        // ============================================================
        async function checkUserSession() {
            try {
                const res = await fetch('/api/user-check');
                const data = await res.json();
                if (data.isLoggedIn) {
                    document.getElementById('userBadge').style.display = 'flex';
                    document.getElementById('userNameDisplay').textContent = data.userName || 'کاربر';
                    document.getElementById('userAvatar').textContent = (data.userName || 'U').charAt(0).toUpperCase();
                    document.getElementById('deviceIdSmall').textContent = '🆔 ' + data.deviceId;
                }
            } catch (e) {}
        }

        async function logoutUser() {
            if (!confirm('آیا از خروج از سیستم مطمئن هستید؟')) return;
            try {
                await fetch('/api/user-logout', { method: 'POST' });
                localStorage.clear();
                window.location.href = '/login.html';
            } catch (e) {
                window.location.href = '/login.html';
            }
        }

        // ============================================================
        // LOAD PRODUCT
        // ============================================================
        async function loadProduct() {
            const slug = window.location.pathname.split('/').pop();
            if (!slug) {
                showError('محصولی یافت نشد');
                return;
            }

            try {
                const res = await fetch('/api/product/slug/' + slug);
                if (!res.ok) {
                    if (res.status === 404) {
                        showError('محصول مورد نظر یافت نشد');
                    } else {
                        throw new Error('خطا در دریافت محصول');
                    }
                    return;
                }

                const product = await res.json();
                renderProduct(product);

            } catch (e) {
                showError(e.message);
            }
        }

        function renderProduct(product) {
            const container = document.getElementById('productContent');

            const hasDiscount = product.discount_price > 0 && product.discount_price < product.price;
            const discountPercent = hasDiscount ? Math.round((1 - product.discount_price / product.price) * 100) : 0;
            const inStock = product.stock > 0;

            // تصاویر
            let thumbnailsHTML = '';
            if (product.images && product.images.length > 0) {
                thumbnailsHTML = product.images.map((img, i) => `
                    <div class="thumb ${i === 0 ? 'active' : ''}" onclick="changeMainImage(this, '${img.image_url}')">
                        <img src="${img.image_url}" alt="تصویر محصول">
                    </div>
                `).join('');
            }

            // ویدیو
            let videoHTML = '';
            if (product.video_url) {
                videoHTML = `
                    <div class="video-container">
                        <video controls>
                            <source src="${product.video_url}" type="video/mp4">
                            مرورگر شما ویدیو را پشتیبانی نمی‌کند
                        </video>
                    </div>
                `;
            }

            // مشخصات فنی
            let specsHTML = '';
            if (product.specifications && product.specifications.length > 0) {
                specsHTML = `
                    <div class="product-specs">
                        <h4><i class="fas fa-table"></i> مشخصات فنی</h4>
                        <table>
                            ${product.specifications.map(spec => `
                                <tr>
                                    <td>${spec.spec_key}</td>
                                    <td>${spec.spec_value}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                `;
            }

            // ویژگی‌ها
            let featuresHTML = '';
            if (product.features && product.features.length > 0) {
                featuresHTML = `
                    <div class="product-features">
                        <h4><i class="fas fa-check-circle"></i> ویژگی‌ها</h4>
                        <ul>
                            ${product.features.map(f => `
                                <li><i class="fas fa-check"></i> ${f}</li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="product-detail">
                    <div class="images-section">
                        <div class="main-image" id="mainImageContainer">
                            <img src="${product.cover_image}" alt="${product.name}" id="mainImage">
                        </div>
                        ${thumbnailsHTML ? `<div class="thumbnails">${thumbnailsHTML}</div>` : ''}
                        ${videoHTML}
                    </div>

                    <div class="info-section">
                        <h1 class="product-name">${product.name}</h1>
                        <div class="product-category">
                            <i class="fas fa-tag"></i> ${product.category_name || 'بدون دسته‌بندی'}
                            ${product.shop_name ? ` • ${product.shop_name}` : ''}
                        </div>

                        <div class="product-price">
                            <span class="current">${product.price.toLocaleString('fa-IR')} تومان</span>
                            ${hasDiscount ? `
                                <span class="old">${product.discount_price.toLocaleString('fa-IR')} تومان</span>
                                <span class="discount-badge">🔥 ${discountPercent}% تخفیف</span>
                            ` : ''}
                        </div>

                        <div class="product-stock ${inStock ? 'in-stock' : 'out-of-stock'}">
                            <i class="fas ${inStock ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                            ${inStock ? '✅ موجود در انبار' : '❌ ناموجود'}
                            ${inStock ? ` (${product.stock} عدد)` : ''}
                        </div>

                        ${product.description ? `
                            <div class="product-description">
                                ${product.description}
                            </div>
                        ` : ''}

                        ${featuresHTML}
                        ${specsHTML}

                        <div class="buy-section">
                            <a href="/panel.html" class="btn btn-primary">
                                <i class="fas fa-shopping-cart"></i> خرید دستگاه
                            </a>
                            <a href="/shop.html" class="btn btn-outline">
                                <i class="fas fa-arrow-right"></i> بازگشت به فروشگاه
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function changeMainImage(element, imageUrl) {
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('mainImage').src = imageUrl;
        }

        function showError(message) {
            document.getElementById('productContent').innerHTML = `
                <div class="error-box">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h2>خطا</h2>
                    <p>${message}</p>
                    <a href="/shop.html" class="btn btn-primary" style="margin-top:16px;display:inline-block;padding:12px 30px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;text-decoration:none;">
                        <i class="fas fa-arrow-right"></i> بازگشت به فروشگاه
                    </a>
                </div>
            `;
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            checkUserSession();
            loadProduct();
        });
    </script>

</body>
</html>
