<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لینک‌های اشتراک | GPS Tracker</title>
    <link rel="icon" href="/ico.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4facfe;
            --secondary: #7c3aed;
            --bg-dark: #0c0e1a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-color: rgba(255, 255, 255, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --font: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            direction: rtl;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .app-header {
            background: rgba(12, 14, 26, 0.92);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            min-height: 64px;
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .app-header .brand .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255,255,255,0.05);
        }
        .app-header .brand .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .app-header .brand .brand-text h1 {
            font-size: 16px; font-weight: 700; color: white;
        }
        .app-header .brand .brand-text span {
            font-size: 10px; color: var(--text-secondary);
        }
        .app-header .user-menu {
            display: flex; align-items: center; gap: 12px;
        }
        .app-header .user-menu .user-badge {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.04);
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .app-header .user-menu .user-badge .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: white;
        }
        .app-header .user-menu .user-badge .user-info-text .name {
            font-size: 13px; font-weight: 600; color: white;
        }
        .app-header .user-menu .user-badge .user-info-text .device-id-small {
            font-size: 9px; color: var(--text-secondary); direction: ltr;
        }
        .app-header .user-menu .btn-icon {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 38px; height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .app-header .user-menu .btn-icon:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }
        .app-header .user-menu .btn-icon.danger:hover {
            background: rgba(234,67,53,0.2);
            color: #ff6b6b;
        }
        .app-header .user-menu .btn-icon.active {
            background: rgba(79,172,254,0.15);
            color: var(--primary);
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px 20px;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }
        .page-header h1 i {
            color: var(--primary);
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
        }
        .page-header .actions {
            display: flex;
            gap: 10px;
        }
        .page-header .actions .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
            text-decoration: none;
        }
        .page-header .actions .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .page-header .actions .btn-primary:hover {
            transform: scale(1.02);
        }
        .page-header .actions .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .page-header .actions .btn-outline:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: var(--transition);
        }
        .link-item:hover {
            border-color: rgba(79,172,254,0.2);
        }
        .link-item .link-info {
            flex: 1;
            min-width: 200px;
        }
        .link-item .link-info .link-url {
            font-size: 13px;
            color: #4FC3F7;
            direction: ltr;
            word-break: break-all;
        }
        .link-item .link-info .link-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .link-item .link-info .link-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .link-item .link-status {
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
        }
        .link-item .link-status.active {
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
        }
        .link-item .link-status.expired {
            background: rgba(234,67,53,0.2);
            color: #ff6b6b;
        }
        .link-item .link-actions {
            display: flex;
            gap: 8px;
        }
        .link-item .link-actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: var(--transition);
            font-family: var(--font);
        }
        .link-item .link-actions .btn-copy {
            background: rgba(79,172,254,0.15);
            color: var(--primary);
        }
        .link-item .link-actions .btn-copy:hover {
            background: rgba(79,172,254,0.25);
        }
        .link-item .link-actions .btn-cancel {
            background: rgba(234,67,53,0.15);
            color: #ff6b6b;
        }
        .link-item .link-actions .btn-cancel:hover {
            background: rgba(234,67,53,0.25);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 48px;
            color: rgba(255,255,255,0.05);
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            color: rgba(255,255,255,0.3);
            font-weight: 500;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .loading-spinner i {
            font-size: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container { padding: 16px 12px; }
            .page-header h1 { font-size: 20px; }
            .link-item { flex-direction: column; align-items: stretch; }
            .link-item .link-actions { justify-content: flex-start; }
            .app-header { padding: 10px 14px; }
            .app-header .brand .brand-text h1 { font-size: 14px; }
            .app-header .brand .brand-text span { display: none; }
            .app-header .user-menu .user-badge { padding: 4px 10px 4px 4px; }
            .app-header .user-menu .user-badge .user-info-text .device-id-small { display: none; }
            .app-header .user-menu .btn-icon { width: 34px; height: 34px; font-size: 13px; }
        }
        @media (max-width: 480px) {
            .page-header .actions .btn { padding: 8px 14px; font-size: 12px; }
            .link-item .link-info .link-url { font-size: 11px; }
            .app-header .brand .logo { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <a href="/index.html" class="brand">
            <div class="logo">
                <img src="/ico.png" alt="GPS Tracker">
            </div>
            <div class="brand-text">
                <h1>GPS Tracker</h1>
                <span>سیستم ردیابی لحظه‌ای</span>
            </div>
        </a>
        <div class="user-menu">
            <div class="user-badge">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-info-text">
                    <span class="name" id="userNameDisplay">کاربر</span>
                    <span class="device-id-small" id="deviceIdSmall">🆔 ---</span>
                </div>
            </div>
            <a href="/index.html" class="btn-icon" title="نقشه"><i class="fas fa-map"></i></a>
            <a href="/trips.html" class="btn-icon" title="سفرها"><i class="fas fa-route"></i></a>
            <a href="/shared-links.html" class="btn-icon active" title="لینک‌های اشتراک"><i class="fas fa-link"></i></a>
            <button class="btn-icon danger" onclick="logoutUser()" title="خروج"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-link"></i> لینک‌های اشتراک</h1>
                <div class="subtitle">مدیریت لینک‌های موقت اشتراک موقعیت</div>
            </div>
            <div class="actions">
                <a href="/index.html" class="btn btn-outline">
                    <i class="fas fa-arrow-right"></i> بازگشت به نقشه
                </a>
                <button class="btn btn-primary" onclick="refreshLinks()">
                    <i class="fas fa-sync-alt"></i> بروزرسانی
                </button>
            </div>
        </div>

        <div id="linksContainer">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch fa-spin"></i>
                <p style="margin-top:12px;">در حال بارگذاری لینک‌ها...</p>
            </div>
        </div>
    </div>

    <!-- ============================================================
    سیستم لودینگ
    ============================================================ -->
    <script src="/loading.js"></script>
    <script>
        // فعال‌سازی لودینگ
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.location.href.includes('loading.html')) {
                autoLoading();
            }
        });

        // ============================================================
        // CHECK SESSION
        // ============================================================
        let deviceId = null;

        async function checkUserSession() {
            try {
                const response = await fetch('/api/user-check');
                const result = await response.json();

                if (!result.isLoggedIn) {
                    window.location.href = '/login.html';
                    return;
                }

                deviceId = result.deviceId;
                document.getElementById('userNameDisplay').textContent = result.userName || 'کاربر';
                document.getElementById('deviceIdSmall').textContent = '🆔 ' + deviceId;
                document.getElementById('userAvatar').textContent = (result.userName || 'U').charAt(0).toUpperCase();

                loadLinks();
            } catch (e) {
                window.location.href = '/login.html';
            }
        }

        async function logoutUser() {
            if (!confirm('آیا از خروج از سیستم مطمئن هستید؟')) return;
            try {
                await fetch('/api/user-logout', { method: 'POST' });
                localStorage.clear();
                window.location.href = '/login.html';
            } catch (e) {
                window.location.href = '/login.html';
            }
        }

        // ============================================================
        // LOAD LINKS
        // ============================================================
        async function loadLinks() {
            try {
                const response = await fetch('/api/shared-links/' + deviceId);
                
                if (!response.ok) {
                    throw new Error('خطا در دریافت لینک‌ها');
                }
                
                const links = await response.json();

                const container = document.getElementById('linksContainer');

                if (!links || links.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-link"></i>
                            <h3>هیچ لینکی ساخته نشده</h3>
                            <p>برای اشتراک گذاری موقعیت، به صفحه نقشه بروید و از دکمه اشتراک استفاده کنید</p>
                            <a href="/index.html" class="btn btn-primary" style="margin-top:16px;display:inline-block;padding:12px 30px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;text-decoration:none;">
                                <i class="fas fa-arrow-right"></i> رفتن به نقشه
                            </a>
                        </div>
                    `;
                    return;
                }

                const now = Date.now();
                container.innerHTML = `
                    <div class="links-list">
                        ${links.map(link => {
                            const isActive = link.isActive && link.expiresAt > now;
                            const remaining = Math.max(0, Math.floor((link.expiresAt - now) / 1000 / 60));
                            return `
                            <div class="link-item">
                                <div class="link-info">
                                    <div class="link-url">${link.url || link.token}</div>
                                    <div class="link-meta">
                                        <span><i class="far fa-calendar-alt"></i> ${new Date(link.createdAt).toLocaleDateString('fa-IR')}</span>
                                        <span><i class="far fa-clock"></i> ${isActive ? remaining + ' دقیقه مانده' : 'منقضی شده'}</span>
                                        <span><i class="fas fa-users"></i> ${link.views || 0} بازدید</span>
                                    </div>
                                </div>
                                <span class="link-status ${isActive ? 'active' : 'expired'}">
                                    ${isActive ? '✅ فعال' : '❌ منقضی شده'}
                                </span>
                                <div class="link-actions">
                                    ${isActive ? `
                                        <button class="btn-copy" onclick="copyLink('${link.url || link.token}')">
                                            <i class="fas fa-copy"></i> کپی
                                        </button>
                                        <button class="btn-cancel" onclick="cancelLink('${link.token}')">
                                            <i class="fas fa-ban"></i> لغو
                                        </button>
                                    ` : `
                                        <button class="btn-copy" onclick="copyLink('${link.url || link.token}')" style="background:rgba(79,172,254,0.15);color:var(--primary);">
                                            <i class="fas fa-copy"></i> کپی
                                        </button>
                                    `}
                                </div>
                            </div>
                        `}).join('')}
                    </div>
                `;

            } catch (error) {
                console.error('Error loading links:', error);
                document.getElementById('linksContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:#ff6b6b;"></i>
                        <h3>خطا در بارگذاری</h3>
                        <p>${error.message || 'خطایی رخ داده است'}</p>
                        <button onclick="refreshLinks()" class="btn btn-primary" style="margin-top:16px;display:inline-block;padding:10px 24px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;border:none;cursor:pointer;">
                            <i class="fas fa-sync-alt"></i> تلاش مجدد
                        </button>
                    </div>
                `;
            }
        }

        function refreshLinks() {
            document.getElementById('linksContainer').innerHTML = `
                <div class="loading-spinner">
                    <i class="fas fa-circle-notch fa-spin"></i>
                    <p style="margin-top:12px;">در حال بروزرسانی...</p>
                </div>
            `;
            loadLinks();
        }

        function copyLink(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('✅ لینک کپی شد');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            try {
                document.execCommand('copy');
                alert('✅ لینک کپی شد');
            } catch (e) {
                alert('❌ کپی نشد، لطفاً دستی کپی کنید');
            }
            document.body.removeChild(input);
        }

        async function cancelLink(token) {
            if (!confirm('آیا از لغو این لینک مطمئن هستید؟')) return;

            try {
                const response = await fetch('/api/share/cancel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('✅ لینک با موفقیت لغو شد');
                    refreshLinks();
                } else {
                    alert('❌ ' + (result.error || 'خطا در لغو لینک'));
                }
            } catch (error) {
                alert('❌ خطا در ارتباط با سرور');
            }
        }

        // ============================================================
        // START
        // ============================================================
        document.addEventListener('DOMContentLoaded', checkUserSession);
    </script>

</body>
</html>
