<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرهای ضبط شده | GPS Tracker</title>
    <link rel="icon" href="/ico.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4facfe;
            --secondary: #7c3aed;
            --bg-dark: #0c0e1a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-color: rgba(255, 255, 255, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --font: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            direction: rtl;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .app-header {
            background: rgba(12, 14, 26, 0.92);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            min-height: 64px;
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .app-header .brand .logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255,255,255,0.05);
        }
        .app-header .brand .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .app-header .brand .brand-text h1 {
            font-size: 16px; font-weight: 700; color: white;
        }
        .app-header .brand .brand-text span {
            font-size: 10px; color: var(--text-secondary);
        }
        .app-header .user-menu {
            display: flex; align-items: center; gap: 12px;
        }
        .app-header .user-menu .user-badge {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.04);
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .app-header .user-menu .user-badge .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: white;
        }
        .app-header .user-menu .user-badge .user-info-text .name {
            font-size: 13px; font-weight: 600; color: white;
        }
        .app-header .user-menu .user-badge .user-info-text .device-id-small {
            font-size: 9px; color: var(--text-secondary); direction: ltr;
        }
        .app-header .user-menu .btn-icon {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 38px; height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .app-header .user-menu .btn-icon:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }
        .app-header .user-menu .btn-icon.danger:hover {
            background: rgba(234,67,53,0.2);
            color: #ff6b6b;
        }
        .app-header .user-menu .btn-icon.active {
            background: rgba(79,172,254,0.15);
            color: var(--primary);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-header h1 i {
            color: var(--primary);
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
        }
        .page-header .actions {
            display: flex;
            gap: 10px;
        }
        .page-header .actions .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
            text-decoration: none;
        }
        .page-header .actions .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .page-header .actions .btn-primary:hover {
            transform: scale(1.02);
        }
        .page-header .actions .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .page-header .actions .btn-outline:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 20px;
            border: 1px solid var(--border-color);
        }
        .stat-card .stat-number {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .trips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .trip-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            cursor: pointer;
        }
        .trip-card:hover {
            border-color: rgba(79,172,254,0.3);
            transform: translateY(-2px);
        }
        .trip-card .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .trip-card .trip-header .trip-id {
            font-size: 11px;
            color: var(--text-secondary);
            direction: ltr;
            font-family: monospace;
        }
        .trip-card .trip-header .trip-status {
            font-size: 10px;
            padding: 3px 12px;
            border-radius: 20px;
        }
        .trip-card .trip-header .trip-status.active {
            background: rgba(234,67,53,0.2);
            color: #ff6b6b;
        }
        .trip-card .trip-header .trip-status.completed {
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
        }
        .trip-card .trip-date {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .trip-card .trip-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .trip-card .trip-stats .stat {
            text-align: center;
        }
        .trip-card .trip-stats .stat .value {
            font-size: 18px;
            font-weight: 700;
            color: #4FC3F7;
        }
        .trip-card .trip-stats .stat .label {
            font-size: 10px;
            color: var(--text-secondary);
        }
        .trip-card .trip-stops {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .trip-card .trip-stops i {
            color: #FFC107;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 48px;
            color: rgba(255,255,255,0.05);
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            color: rgba(255,255,255,0.3);
            font-weight: 500;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .loading-spinner i {
            font-size: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container { padding: 16px 12px; }
            .page-header h1 { font-size: 20px; }
            .trips-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .app-header { padding: 10px 14px; }
            .app-header .brand .brand-text h1 { font-size: 14px; }
            .app-header .brand .brand-text span { display: none; }
            .app-header .user-menu .user-badge { padding: 4px 10px 4px 4px; }
            .app-header .user-menu .user-badge .user-info-text .device-id-small { display: none; }
            .app-header .user-menu .btn-icon { width: 34px; height: 34px; font-size: 13px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .trip-card .trip-stats { grid-template-columns: 1fr 1fr; }
            .page-header .actions .btn { padding: 8px 14px; font-size: 12px; }
            .app-header .brand .logo { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <a href="/index.html" class="brand">
            <div class="logo">
                <img src="/ico.png" alt="GPS Tracker">
            </div>
            <div class="brand-text">
                <h1>GPS Tracker</h1>
                <span>سیستم ردیابی لحظه‌ای</span>
            </div>
        </a>
        <div class="user-menu">
            <div class="user-badge">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-info-text">
                    <span class="name" id="userNameDisplay">کاربر</span>
                    <span class="device-id-small" id="deviceIdSmall">🆔 ---</span>
                </div>
            </div>
            <a href="/index.html" class="btn-icon" title="نقشه"><i class="fas fa-map"></i></a>
            <a href="/trips.html" class="btn-icon active" title="سفرها"><i class="fas fa-route"></i></a>
            <a href="/shared-links.html" class="btn-icon" title="لینک‌های اشتراک"><i class="fas fa-link"></i></a>
            <button class="btn-icon danger" onclick="logoutUser()" title="خروج"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-route"></i> سفرهای ضبط شده</h1>
                <div class="subtitle">لیست تمام سفرهای ثبت شده دستگاه شما</div>
            </div>
            <div class="actions">
                <a href="/index.html" class="btn btn-outline">
                    <i class="fas fa-arrow-right"></i> بازگشت به نقشه
                </a>
                <button class="btn btn-primary" onclick="refreshTrips()">
                    <i class="fas fa-sync-alt"></i> بروزرسانی
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-number" id="totalTrips">0</div>
                <div class="stat-label">تعداد سفرها</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalDistance">0</div>
                <div class="stat-label">کیلومتر پیموده</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalStops">0</div>
                <div class="stat-label">تعداد توقف‌ها</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="maxSpeed">0</div>
                <div class="stat-label">حداکثر سرعت</div>
            </div>
        </div>

        <!-- Trips List -->
        <div id="tripsContainer">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch fa-spin"></i>
                <p style="margin-top:12px;">در حال بارگذاری سفرها...</p>
            </div>
        </div>
    </div>

    <!-- ============================================================
    سیستم لودینگ
    ============================================================ -->
    <script src="/loading.js"></script>
    <script>
        // فعال‌سازی لودینگ
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.location.href.includes('loading.html')) {
                autoLoading();
            }
        });

        // ============================================================
        // CHECK SESSION
        // ============================================================
        let deviceId = null;
        let buyerName = '';

        async function checkUserSession() {
            try {
                const response = await fetch('/api/user-check');
                const result = await response.json();

                if (!result.isLoggedIn) {
                    window.location.href = '/login.html';
                    return;
                }

                deviceId = result.deviceId;
                buyerName = result.userName || 'کاربر';

                document.getElementById('userNameDisplay').textContent = buyerName;
                document.getElementById('deviceIdSmall').textContent = '🆔 ' + deviceId;
                document.getElementById('userAvatar').textContent = buyerName.charAt(0).toUpperCase();

                loadTrips();
            } catch (e) {
                window.location.href = '/login.html';
            }
        }

        async function logoutUser() {
            if (!confirm('آیا از خروج از سیستم مطمئن هستید؟')) return;
            try {
                await fetch('/api/user-logout', { method: 'POST' });
                localStorage.clear();
                window.location.href = '/login.html';
            } catch (e) {
                window.location.href = '/login.html';
            }
        }

        // ============================================================
        // LOAD TRIPS
        // ============================================================
        async function loadTrips() {
            try {
                const response = await fetch('/api/trips/' + deviceId);
                const trips = await response.json();

                const container = document.getElementById('tripsContainer');

                if (trips.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-route"></i>
                            <h3>هیچ سفری ثبت نشده</h3>
                            <p>برای شروع ضبط حرکت، به صفحه نقشه بروید و دکمه ضبط را فعال کنید</p>
                            <a href="/index.html" class="btn btn-primary" style="margin-top:16px;display:inline-block;padding:12px 30px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;text-decoration:none;">
                                <i class="fas fa-arrow-right"></i> رفتن به نقشه
                            </a>
                        </div>
                    `;
                    updateStats([]);
                    return;
                }

                // محاسبه آمار
                let totalDist = 0;
                let totalStops = 0;
                let maxSpd = 0;

                trips.forEach(t => {
                    totalDist += t.totalDistance || 0;
                    totalStops += (t.stops || []).length;
                    if (t.maxSpeed > maxSpd) maxSpd = t.maxSpeed;
                });

                updateStats({ totalTrips: trips.length, totalDist, totalStops, maxSpd });

                container.innerHTML = `
                    <div class="trips-grid">
                        ${trips.map(trip => `
                            <div class="trip-card" onclick="viewTrip('${trip.id}')">
                                <div class="trip-header">
                                    <span class="trip-id">${trip.id}</span>
                                    <span class="trip-status ${trip.isActive ? 'active' : 'completed'}">
                                        ${trip.isActive ? '⏳ در حال ضبط' : '✅ تکمیل شده'}
                                    </span>
                                </div>
                                <div class="trip-date">
                                    <i class="far fa-calendar-alt"></i>
                                    ${new Date(trip.startTime).toLocaleDateString('fa-IR')} - 
                                    ${new Date(trip.startTime).toLocaleTimeString('fa-IR')}
                                    ${trip.endTime ? ' تا ' + new Date(trip.endTime).toLocaleTimeString('fa-IR') : ''}
                                </div>
                                <div class="trip-stats">
                                    <div class="stat">
                                        <div class="value">${(trip.totalDistance || 0).toFixed(1)}</div>
                                        <div class="label">کیلومتر</div>
                                    </div>
                                    <div class="stat">
                                        <div class="value">${Math.round(trip.maxSpeed || 0)}</div>
                                        <div class="label">حداکثر سرعت</div>
                                    </div>
                                    <div class="stat">
                                        <div class="value">${Math.round(trip.avgSpeed || 0)}</div>
                                        <div class="label">میانگین سرعت</div>
                                    </div>
                                </div>
                                ${trip.stops && trip.stops.length > 0 ? `
                                    <div class="trip-stops">
                                        <i class="fas fa-stop-circle"></i>
                                        ${trip.stops.length} توقف (${trip.stops.reduce((a,b) => a + b.duration, 0)} ثانیه)
                                    </div>
                                ` : ''}
                                <div style="margin-top:10px;font-size:11px;color:var(--text-secondary);">
                                    <i class="fas fa-map-pin"></i>
                                    ${trip.locations ? trip.locations.length : 0} نقطه ثبت شده
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

            } catch (error) {
                document.getElementById('tripsContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color:#ff6b6b;"></i>
                        <h3>خطا در بارگذاری</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function updateStats(data) {
            document.getElementById('totalTrips').textContent = data.totalTrips || 0;
            document.getElementById('totalDistance').textContent = (data.totalDist || 0).toFixed(1);
            document.getElementById('totalStops').textContent = data.totalStops || 0;
            document.getElementById('maxSpeed').textContent = Math.round(data.maxSpd || 0);
        }

        function refreshTrips() {
            document.getElementById('tripsContainer').innerHTML = `
                <div class="loading-spinner">
                    <i class="fas fa-circle-notch fa-spin"></i>
                    <p style="margin-top:12px;">در حال بروزرسانی...</p>
                </div>
            `;
            loadTrips();
        }

        function viewTrip(tripId) {
            window.location.href = '/trip-detail.html?id=' + tripId;
        }

        document.addEventListener('DOMContentLoaded', checkUserSession);
    </script>

</body>
</html>
