<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>در حال بارگذاری | GPS Tracker</title>
    <link rel="icon" href="/ico.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ============================================================
           RESET & VARIABLES
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4facfe;
            --primary-dark: #3b82f6;
            --secondary: #7c3aed;
            --bg-dark: #0c0e1a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-color: rgba(255, 255, 255, 0.06);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            direction: rtl;
        }

        /* ============================================================
           BACKGROUND EFFECTS
           ============================================================ */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-effects .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
        }

        .bg-effects .circle-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            right: -100px;
            animation: float1 20s ease-in-out infinite;
        }

        .bg-effects .circle-2 {
            width: 300px;
            height: 300px;
            background: var(--secondary);
            bottom: -50px;
            left: -50px;
            animation: float2 25s ease-in-out infinite;
        }

        .bg-effects .circle-3 {
            width: 200px;
            height: 200px;
            background: var(--primary-dark);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: float3 15s ease-in-out infinite;
        }

        @keyframes float1 {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(50px, 80px);
            }
        }

        @keyframes float2 {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(-60px, -60px);
            }
        }

        @keyframes float3 {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
            }
        }

        /* ============================================================
           LOADING CONTAINER
           ============================================================ */
        .loading-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }

        /* ============================================================
           LOGO
           ============================================================ */
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
        }

        .logo-wrapper .logo {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(79, 172, 254, 0.15);
        }

        .logo-wrapper .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-wrapper .brand-text h1 {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .logo-wrapper .brand-text h1 span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-wrapper .brand-text p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ============================================================
           CAR ANIMATION (FROM UNVERSE)
           ============================================================ */
        .car-wrapper {
            transform: scale(0.85);
            transform-origin: center;
        }

        .container {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .car-container {
            position: absolute;
            width: 380px;
            height: 380px;
            animation: lift 3s infinite cubic-bezier(0.96, 0.5, 0.27, 0.55);
            transform-origin: center;
        }

        @keyframes lift {
            0%,
            30% {
                transform: rotate(0deg) translateY(0px);
            }
            32% {
                transform: rotate(-1.5deg) translateY(-2px);
            }
            48%,
            50% {
                transform: rotate(0deg) translateY(0px);
            }
            56.5% {
                transform: rotate(1deg) translateY(-1px);
            }
            68% {
                transform: rotate(0deg) translateY(0px);
            }
        }

        /* Car Body */
        .car {
            position: absolute;
            width: 220px;
            height: 110px;
            background: linear-gradient(135deg, #1a3a6a, #2a5aaa);
            left: 30px;
            top: 150px;
            clip-path: polygon(6% 0%, 80% 0%, 100% 50%, 100% 100%, 0% 100%);
            border-radius: 0 0 0 10px;
        }

        .car::before {
            content: "";
            position: absolute;
            width: 220px;
            height: 45px;
            background: linear-gradient(135deg, #2a5aaa, #3a7acc);
            left: 0px;
            top: 5px;
            border-top: 4px solid #0f2a5a;
            border-bottom: 2px solid #0f2a5a;
        }

        .car::after {
            content: "";
            position: absolute;
            width: 2px;
            height: 110px;
            background-color: #0f2a5a;
            left: 140px;
            top: 5px;
            transform: rotate(3deg);
            box-shadow: -65px 5px #0f2a5a, 78px 5px #0f2a5a;
        }

        .front-part {
            position: absolute;
            width: 100px;
            height: 55px;
            background: linear-gradient(135deg, #1a3a6a, #2a5aaa);
            right: 30px;
            top: 205px;
            clip-path: polygon(0% 0%, 100% 20%, 100% 100%, 0% 100%);
        }

        .front-part2 {
            position: absolute;
            width: 100px;
            height: 10px;
            background: #2a5aaa;
            right: 30px;
            transform: rotate(6.3deg);
            top: 212px;
            border-bottom: 2px solid #0f2a5a;
        }

        .front-part2::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 8px;
            background: rgba(251, 243, 205, 0.6);
            right: 22px;
            top: -4px;
            box-shadow: inset 0px -3px rgba(0, 0, 0, 0.8);
        }

        .front-part2::before {
            content: "";
            position: absolute;
            width: 95px;
            height: 5px;
            background: #3a7acc;
            top: -5px;
            border-radius: 50% 50% 0% 0%;
        }

        .front-part3 {
            position: absolute;
            background: rgba(0, 0, 0, 0.2);
            width: 320px;
            height: 30px;
            bottom: 120px;
            left: 30px;
            box-shadow: inset 0px 12px rgba(79, 172, 254, 0.1);
        }

        .front-part3::before {
            content: "";
            position: absolute;
            background: rgba(79, 172, 254, 0.1);
            width: 220px;
            height: 8px;
            bottom: 46px;
            left: 0px;
        }

        .bottom-part {
            position: absolute;
            width: 320px;
            height: 20px;
            background: #0f2a5a;
            left: 30px;
            top: 260px;
        }

        .bottom-part::before {
            content: "";
            position: absolute;
            width: 50px;
            height: 25px;
            background: #4a6a8a;
            left: -8px;
            top: -5px;
            border-radius: 5px 0px 0px 10px;
            box-shadow: inset -5px -8px rgba(0, 0, 0, 0.4), inset -5px 3px rgba(255, 255, 255, 0.3);
        }

        /* Windows */
        .window {
            width: 55px;
            height: 40px;
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            top: 160px;
            left: 45px;
            transform: skew(-5deg);
            border-radius: 6px;
            box-shadow: inset 0px 0px 0px 2px rgba(61, 61, 61, 0.5);
            border: 1px solid rgba(79, 172, 254, 0.15);
        }

        .window::before {
            content: "";
            width: 48px;
            height: 40px;
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            top: 0px;
            left: 72px;
            border-radius: 6px;
            box-shadow: inset 0px 0px 0px 2px rgba(61, 61, 61, 0.5);
            border: 1px solid rgba(79, 172, 254, 0.15);
        }

        .window::after {
            content: "";
            width: 30px;
            height: 40px;
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            top: 0px;
            left: 132px;
            border-radius: 6px 6px 0px 6px;
            box-shadow: inset 2px 0px rgba(61, 61, 61, 0.5), inset 0px 2px rgba(61, 61, 61, 0.5);
            border: 1px solid rgba(79, 172, 254, 0.15);
        }

        .window2 {
            width: 53px;
            height: 20px;
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            top: 180px;
            left: 180px;
            border-radius: 0% 100% 10% 0% / 0% 80% 10% 4%;
            box-shadow: inset 0px -2px rgba(61, 61, 61, 0.5);
            border: 1px solid rgba(79, 172, 254, 0.15);
        }

        .window2::before {
            content: "";
            position: absolute;
            width: 15px;
            height: 42px;
            background: rgba(0, 0, 0, 0.7);
            top: -18px;
            right: 11px;
            transform: rotate(-37deg);
            border-radius: 0% 10% 0% 100%;
            box-shadow: inset -2px 0px rgba(61, 61, 61, 0.5);
            border: 1px solid rgba(79, 172, 254, 0.15);
        }

        .window2::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 36px;
            background: rgba(60, 60, 61, 0.7);
            top: -18px;
            right: 25px;
            transform: skew(37deg);
            box-shadow: -60px 0px rgba(60, 60, 61, 0.7), -130px 0px rgba(60, 60, 61, 0.7);
            border: 1px solid rgba(79, 172, 254, 0.1);
        }

        .window3 {
            width: 4px;
            height: 25px;
            position: absolute;
            background: rgba(187, 188, 188, 0.3);
            top: 173px;
            left: 189px;
            transform: skew(38deg);
            box-shadow: -60px 0px rgba(187, 188, 188, 0.3), -129px -1px rgba(187, 188, 188, 0.3);
        }

        .window3::before {
            content: "";
            width: 3px;
            height: 55px;
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            top: -22px;
            left: 42px;
        }

        /* Head Lights */
        .head-lights {
            position: absolute;
            width: 16px;
            height: 20px;
            background: rgba(212, 207, 166, 0.8);
            left: 334px;
            bottom: 140px;
            box-shadow: inset 3px 0px #0f2a5a, inset -5px 0px #4a6a8a, inset -5px 0px #2a5aaa;
            border-radius: 2px;
        }

        .head-lights::before {
            content: "";
            position: absolute;
            width: 4px;
            height: 15px;
            background: #0f2a5a;
            left: 11px;
            bottom: 0px;
        }

        .head-lights::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(15, 42, 90, 0.5);
            left: 3px;
            bottom: 0px;
            box-shadow: -1px -13px 0px -1px rgba(254, 254, 235, 0.5);
        }

        .head-lights .glow {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.15), transparent);
            left: -15px;
            top: -10px;
            border-radius: 50%;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* Tail Lights */
        .tail-lights {
            position: absolute;
            width: 4px;
            height: 10px;
            background: #ff4444;
            right: 348px;
            bottom: 125px;
            box-shadow: inset -2px 0px #cc0000;
            border-radius: 1px;
        }

        .tail-lights::before {
            content: "";
            position: absolute;
            width: 14px;
            height: 16px;
            background: rgba(255, 0, 0, 0.2);
            left: -4px;
            border-radius: 50%;
        }

        /* Wheels */
        .container-wheel1 {
            width: 80px;
            height: 80px;
            position: absolute;
            bottom: 60px;
            left: 50px;
        }

        .container-wheel2 {
            width: 80px;
            height: 80px;
            position: absolute;
            bottom: 60px;
            left: 245px;
        }

        .wheel-ring {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            left: 10px;
            top: 10px;
            border: 6px solid #1a1a2e;
            box-shadow: 0px 0px 0px 4px #3a3a5a, inset 0px 0px 0px 2px #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-ring1 {
            animation: spinning 1s linear infinite;
        }

        .wheel-ring2 {
            animation: spinning 1s linear infinite;
        }

        @keyframes spinning {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .container-wheel1 {
            animation: bounce1 3s infinite;
        }

        .container-wheel2 {
            animation: bounce2 3s infinite;
        }

        @keyframes bounce1 {
            0%,
            50% {
                transform: translateY(0px);
            }
            52% {
                transform: translateY(-5px);
            }
            65% {
                transform: translateY(0px);
            }
        }

        @keyframes bounce2 {
            0%,
            28% {
                transform: translateY(0px);
            }
            30% {
                transform: translateY(-5px);
            }
            45% {
                transform: translateY(0px);
            }
        }

        .wheel-center {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, #aaa);
            box-shadow: inset 0px 0px 0px 5px, inset 0px 0px 0px 6px #ccc, inset 0px 0px 0px 12px #000;
        }

        .wheel-center2 {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .wheel-ring-stick {
            position: absolute;
            width: 4px;
            height: 18px;
            background: #1a1a2e;
            top: 32px;
            left: 19px;
            transform: rotate(15deg);
        }

        .wheel-ring-stick::before {
            content: "";
            position: absolute;
            width: 4px;
            height: 18px;
            background: #1a1a2e;
            top: -2px;
            left: 8px;
            transform: rotate(-20deg);
        }

        .wheel-ring-stick2 {
            transform: rotate(82deg);
            left: 8px;
            top: 16px;
        }

        .wheel-ring-stick3 {
            left: 34px;
            top: 25px;
            transform: rotate(-55deg);
        }

        .wheel-ring-stick4 {
            top: 2px;
            left: 17px;
            transform: rotate(155deg);
        }

        .wheel-ring-stick5 {
            top: 7px;
            left: 36px;
            transform: rotate(225deg);
        }

        .wheel-logo {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 1px 4px 1px;
            border-color: transparent transparent rgba(79, 172, 254, 0.6) transparent;
            z-index: 1;
            transform: scale(1);
        }

        .wheel-logo::before {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 1px 4px 1px;
            border-color: transparent transparent rgba(79, 172, 254, 0.6) transparent;
            transform: rotate(-65deg);
            right: 1px;
        }

        .wheel-logo::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 1px 4px 1px;
            border-color: transparent transparent rgba(79, 172, 254, 0.6) transparent;
            transform: rotate(65deg);
            left: 1px;
        }

        /* Bumper */
        .bumper {
            position: absolute;
            width: 20px;
            height: 35px;
            background: #1a1a2e;
            bottom: 100px;
            right: 23px;
            border-radius: 0% 20% 20% 0%;
            box-shadow: inset -4px 0px rgba(79, 79, 79, 0.5);
        }

        .bumper::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 3px;
            background: rgba(105, 105, 105, 0.5);
            box-shadow: 0px 14px 0px -0.3px rgba(251, 251, 251, 0.15);
        }

        .bumper2 {
            position: absolute;
            width: 25px;
            height: 5px;
            background: #1a1a2e;
            bottom: 101px;
            right: 23px;
            rotate: 5deg;
        }

        /* Street */
        .street {
            position: absolute;
            width: 600px;
            height: 450px;
            bottom: 0px;
            z-index: -1;
            overflow: hidden;
        }

        .line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: rgba(79, 172, 254, 0.15);
            bottom: 62px;
        }

        .obstacles {
            position: absolute;
            width: 20px;
            height: 15px;
            background: rgba(79, 172, 254, 0.1);
            border-radius: 40% 40% 0% 0%;
            bottom: 60px;
            left: 110%;
            animation: displacement 3s linear infinite;
        }

        @keyframes displacement {
            0% {
                left: 110%;
            }
            100% {
                left: -40%;
            }
        }

        /* ============================================================
           LOADING TEXT & PROGRESS
           ============================================================ */
        .loading-info {
            text-align: center;
            margin-top: 10px;
        }

        .loading-info .status-text {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .loading-info .status-text .highlight {
            color: var(--primary);
        }

        .loading-info .dots {
            display: inline-flex;
            gap: 4px;
            margin-right: 4px;
        }

        .loading-info .dots span {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            animation: dot-bounce 1.4s ease-in-out infinite;
        }

        .loading-info .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading-info .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dot-bounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Progress Bar */
        .progress-wrapper {
            width: 280px;
            margin-top: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            width: 0%;
            animation: progress-anim 2.5s ease-in-out forwards;
        }

        @keyframes progress-anim {
            0% {
                width: 0%;
            }
            30% {
                width: 25%;
            }
            60% {
                width: 65%;
            }
            85% {
                width: 85%;
            }
            100% {
                width: 100%;
            }
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* ============================================================
           VERSION INFO
           ============================================================ */
        .version-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 11px;
            color: var(--text-muted);
            z-index: 1;
        }

        .version-info i {
            margin-left: 4px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            .car-wrapper {
                transform: scale(0.6);
            }

            .logo-wrapper .logo {
                width: 44px;
                height: 44px;
            }

            .logo-wrapper .brand-text h1 {
                font-size: 22px;
            }

            .logo-wrapper .brand-text p {
                font-size: 11px;
            }

            .progress-wrapper {
                width: 220px;
            }

            .loading-info .status-text {
                font-size: 13px;
            }
        }

        @media (max-width: 360px) {
            .car-wrapper {
                transform: scale(0.45);
            }

            .logo-wrapper .brand-text h1 {
                font-size: 18px;
            }

            .progress-wrapper {
                width: 180px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    BACKGROUND EFFECTS
    ============================================================ -->
    <div class="bg-effects">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <!-- ============================================================
    LOADING CONTAINER
    ============================================================ -->
    <div class="loading-container">

        <!-- Logo -->
        <div class="logo-wrapper">
            <div class="logo">
                <img src="/ico.png" alt="GPS Tracker">
            </div>
            <div class="brand-text">
                <h1>GPS <span>Tracker</span></h1>
                <p>سیستم ردیابی هوشمند</p>
            </div>
        </div>

        <!-- Car Animation -->
        <div class="car-wrapper">
            <div class="container">
                <div class="car-container">
                    <div class="car"></div>
                    <div class="front-part"></div>
                    <div class="front-part2"></div>
                    <div class="front-part3"></div>
                    <div class="bottom-part"></div>

                    <div class="window"></div>
                    <div class="window2"></div>
                    <div class="window3"></div>

                    <div class="head-lights">
                        <div class="glow"></div>
                    </div>
                    <div class="tail-lights"></div>

                    <div class="bumper"></div>
                    <div class="bumper2"></div>

    <!-- ============================================================
    SCRIPT - REDIRECT AFTER LOADING
    ============================================================ -->
    <script>
        // ============================================================
        // PROGRESS PERCENTAGE UPDATE
        // ============================================================
        const progressPercent = document.getElementById('progressPercent');
        let progress = 0;

        // تابع آپدیت درصد
        function updateProgress() {
            // دریافت عرض فعلی progress-fill
            const fill = document.querySelector('.progress-fill');
            const computedStyle = window.getComputedStyle(fill);
            const width = parseFloat(computedStyle.width);
            const parentWidth = parseFloat(computedStyle.parentElement?.offsetWidth || 280);

            // محاسبه درصد
            const percent = Math.min(Math.round((width / parentWidth) * 100), 100);
            progressPercent.textContent = percent + '%';
        }

        // آپدیت هر ۱۰۰ میلی‌ثانیه
        const progressInterval = setInterval(updateProgress, 100);

        // ============================================================
        // DETERMINE REDIRECT PAGE
        // ============================================================
        function getRedirectPage() {
            // بررسی پارامترهای URL
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect');

            if (redirect) {
                return redirect;
            }

            // بررسی سشن کاربر
            return fetch('/api/user-check', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (data.isLoggedIn) {
                        return '/panel.html';
                    }
                    return '/home.html';
                })
                .catch(() => '/home.html');
        }

        // ============================================================
        // REDIRECT AFTER 3 SECONDS
        // ============================================================
        setTimeout(async () => {
            clearInterval(progressInterval);
            progressPercent.textContent = '۱۰۰%';

            try {
                const page = await getRedirectPage();
                window.location.href = page;
            } catch (e) {
                window.location.href = '/home.html';
            }
        }, 3000);

        // ============================================================
        // ALSO REDIRECT ON CLICK (USER IMPATIENT)
        // ============================================================
        document.addEventListener('click', () => {
            clearInterval(progressInterval);
            progressPercent.textContent = '۱۰۰%';

            setTimeout(async () => {
                try {
                    const page = await getRedirectPage();
                    window.location.href = page;
                } catch (e) {
                    window.location.href = '/home.html';
                }
            }, 200);
        });

        console.log('🚗 لودینگ GPS Tracker...');
    </script>
